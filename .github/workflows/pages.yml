name: Pages

# Publishes the generated glyph comparison page to GitHub Pages.
#
# The page itself is not authored in `pages/`: it is produced by
# `demo/build_glyph_demo.py` from the ANSI captured by
# `crates/rpi-cli/examples/glyph_capture.rs`. This workflow rebuilds it from
# source so the published site can never drift from the components it documents.

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "demo/ansi_grid.py"
      - "demo/build_glyph_demo.py"
      - "crates/rpi-cli/examples/glyph_capture.rs"
      - "crates/rpi-tui/src/**"
      - "crates/rpi-cli/src/interactive_tui/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "pages/**"
      - "demo/ansi_grid.py"
      - "demo/build_glyph_demo.py"
      - "crates/rpi-cli/examples/glyph_capture.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build glyph page
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The capture example calls the real components, so the bytes published
      # are the ones the renderer emits on the pinned toolchain.
      - name: Capture ANSI from the real components
        run: |
          cargo run -q -p rpi-cli --example glyph_capture > demo/_capture.txt
          test -s demo/_capture.txt

      - name: Rebuild the page from the capture
        run: python3 demo/build_glyph_demo.py --out pages/index.html

      # Round-trip: decode the generated HTML back to a character grid and diff
      # it against the captured bytes, cell by cell.
      - name: Verify the page reproduces the captured grid
        run: python3 demo/_verify.py pages/index.html

      - name: Assert the committed copy matches the rebuild
        run: |
          if ! cmp -s demo/glyph-changes-demo.html pages/index.html; then
            echo "::error file=pages/index.html::pages/index.html is stale."
            echo "Run: cargo run -q -p rpi-cli --example glyph_capture > demo/_capture.txt"
            echo "     python demo/build_glyph_demo.py"
            echo "     python demo/build_glyph_demo.py --out pages/index.html"
            diff -u demo/glyph-changes-demo.html pages/index.html | head -80 || true
            exit 1
          fi

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: pages

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
